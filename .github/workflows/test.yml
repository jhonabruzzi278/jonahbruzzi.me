name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest + coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails the job if coverage drops below the thresholds in
      # vitest.config.ts (statements 90% / branches 80% / functions 85% /
      # lines 90%), scoped to the modules that currently have tests
      # (mappers.ts, cart.ts, checkout.ts, auth.ts — see
      # aidlc-docs/testing/TEST_STRATEGY.md). Extend that include list as
      # more modules get tests.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (m) => s[m].pct + '%';
              console.log('## Coverage summary (mappers.ts, cart.ts, checkout.ts, auth.ts)');
              console.log('');
              console.log('| Metric | Coverage |');
              console.log('|---|---|');
              console.log('| Statements | ' + pct('statements') + ' |');
              console.log('| Branches | ' + pct('branches') + ' |');
              console.log('| Functions | ' + pct('functions') + ' |');
              console.log('| Lines | ' + pct('lines') + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi
